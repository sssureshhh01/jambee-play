<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3ec6ff">
<title>Jelly Escape</title>
<style>
  :root{--text:#173a5e;--muted:#4f7396;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#3ec6ff;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;}
  #app{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;height:100%;pointer-events:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  #app > *{pointer-events:auto;}
  .topbar{width:100%;max-width:520px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:12px 14px 4px;}
  .ibtn{width:44px;height:44px;border-radius:15px;border:0;background:rgba(255,255,255,.9);color:var(--text);font-size:19px;cursor:pointer;box-shadow:0 4px 0 rgba(20,60,120,.18);}
  .lvl{text-align:center;}
  .lvl .t{font-size:19px;font-weight:900;letter-spacing:.05em;color:#fff;text-shadow:0 2px 0 rgba(20,60,120,.35);}
  .timer{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:4px 12px;border-radius:12px;background:rgba(255,255,255,.9);font-weight:900;font-variant-numeric:tabular-nums;font-size:15px;box-shadow:0 3px 0 rgba(20,60,120,.15);transition:transform .2s;}
  .timer.low{background:#ff4d6d;color:#fff;animation:tick 1s infinite;}
  .timer.frozen{background:#bfe9ff;color:#1a5a8a;}
  @keyframes tick{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
  .coins{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:20px;background:rgba(255,255,255,.9);font-weight:900;font-variant-numeric:tabular-nums;box-shadow:0 4px 0 rgba(20,60,120,.18);}
  .coins .c{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffcf5a 45%,#c48a12);}
  #stage{position:relative;flex:1;width:100%;max-width:520px;min-height:0;}
  #c{display:block;width:100%;height:100%;}
  .bottombar{display:flex;gap:10px;width:100%;max-width:440px;padding:2px 16px 14px;}
  .tool{flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 4px;border-radius:17px;border:0;
    background:rgba(255,255,255,.92);color:var(--text);font:900 14px system-ui,sans-serif;cursor:pointer;box-shadow:0 5px 0 rgba(20,60,120,.2);transition:transform .1s;}
  .tool:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(20,60,120,.2);}
  .tool .ic{font-size:20px;}
  .tool b{position:absolute;top:-8px;right:-4px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#ff4d6d;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;}
  .tool b.ad{background:#3a86ff;font-size:10px;}
  .overlay{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(10,40,80,.35);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);}
  .overlay.show{display:flex;animation:pop .3s cubic-bezier(.3,1.5,.5,1);}
  @keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
  .card{background:#fff;border-radius:28px;padding:24px 20px;width:min(90%,360px);text-align:center;box-shadow:0 10px 0 rgba(20,60,120,.18),0 30px 60px rgba(10,40,80,.3);max-height:92%;overflow:auto;}
  .card h2{margin:0 0 6px;font-size:24px;font-weight:900;} .card p{margin:4px 0;color:var(--muted);font-size:14px;}
  .cta{display:block;width:100%;margin-top:12px;padding:15px;border-radius:18px;border:0;font:900 17px system-ui,sans-serif;cursor:pointer;transition:transform .1s;}
  .cta:active{transform:translateY(3px);}
  .main{background:linear-gradient(180deg,#5ee0a0,#2ec27e);color:#05391f;box-shadow:0 6px 0 #1a8a55;}
  .gold{background:linear-gradient(180deg,#ffd60a,#ff9f1c);color:#4a2a00;box-shadow:0 6px 0 #c76a00;}
  .blue{background:linear-gradient(180deg,#5fb0ff,#3a6cff);color:#fff;box-shadow:0 6px 0 #2340b0;}
  .soft{background:#eef6ff;color:var(--text);box-shadow:0 6px 0 #c4dcf5;}
  .sub{display:block;font-size:12px;font-weight:700;opacity:.8;margin-top:2px;}
  .stars{display:flex;justify-content:center;gap:10px;margin:12px 0 6px;}
  .stars span{font-size:48px;filter:grayscale(1) brightness(1.4) opacity(.4);transform:scale(.4);transition:all .4s cubic-bezier(.3,1.8,.5,1);}
  .stars span.on{filter:none;transform:scale(1);}
  .reward{font-size:28px;font-weight:900;color:#e08a00;margin:6px 0;}
  .home{text-align:center;width:min(92%,360px);}
  .title{font-size:50px;font-weight:900;line-height:.95;color:#fff;text-shadow:0 4px 0 #2ec27e,0 8px 0 #1a8a55,0 14px 24px rgba(10,40,80,.35);}
  .tagline{color:#fff;font-weight:800;margin:14px 0 20px;letter-spacing:.14em;font-size:13px;text-shadow:0 2px 0 rgba(20,60,120,.3);}
  .jellies{display:flex;justify-content:center;gap:10px;margin-bottom:18px;}
  .jl{width:52px;height:52px;border-radius:16px;position:relative;animation:jig 1.4s ease-in-out infinite;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15),inset 0 6px 0 rgba(255,255,255,.35);}
  .jl::before,.jl::after{content:'';position:absolute;top:16px;width:10px;height:13px;border-radius:50%;background:#fff;box-shadow:inset 3px 2px 0 2px #1a2a3a;}
  .jl::before{left:12px}.jl::after{right:12px}
  .jl:nth-child(2){animation-delay:.15s}.jl:nth-child(3){animation-delay:.3s}.jl:nth-child(4){animation-delay:.45s}
  @keyframes jig{0%,100%{transform:scale(1,1) translateY(0)}30%{transform:scale(1.12,.88) translateY(4px)}60%{transform:scale(.92,1.08) translateY(-8px)}}
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 92px);transform:translate(-50%,-20px);opacity:0;z-index:30;pointer-events:none;
    background:#fff;padding:11px 18px;border-radius:16px;font-size:14px;font-weight:800;max-width:90%;text-align:center;transition:all .3s;box-shadow:0 6px 0 rgba(20,60,120,.15),0 10px 30px rgba(10,40,80,.25);}
  #toast.show{opacity:1;transform:translate(-50%,0);}
  .toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid #e6f0fb;font-size:16px;font-weight:700;}
  .sw2{width:50px;height:30px;border-radius:15px;background:#c9d9ea;position:relative;cursor:pointer;transition:background .2s;}
  .sw2::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.2);}
  .sw2.on{background:#2ec27e;} .sw2.on::after{left:23px;}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">
  <div class="topbar">
    <button class="ibtn" id="homeBtn" aria-label="Home">🏠</button>
    <div class="lvl"><div class="t" id="lvlTitle">LEVEL 1</div><div class="timer" id="timer">⏱ <span id="timeTxt">--</span></div></div>
    <div class="coins"><span class="c"></span><span id="coinTxt">0</span></div>
  </div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div class="bottombar">
    <button class="tool" id="hintBtn"><span class="ic">💡</span>Hint<b id="hintB">3</b></button>
    <button class="tool" id="freezeBtn"><span class="ic">❄️</span>Freeze<b id="freezeB">2</b></button>
    <button class="tool" id="restartBtn"><span class="ic">↻</span>Retry</button>
  </div>
</div>

<div class="overlay show" id="homeOv">
  <div class="home">
    <div class="jellies"><div class="jl" style="background:#ff4d6d"></div><div class="jl" style="background:#ffd60a"></div><div class="jl" style="background:#2ec27e"></div><div class="jl" style="background:#9d4edd"></div></div>
    <div class="title">JELLY<br>ESCAPE</div>
    <div class="tagline">SLIDE · MATCH · ESCAPE</div>
    <button class="cta gold" id="playBtn" style="font-size:21px;padding:18px">Play<span class="sub" id="playSub">Level 1</span></button>
    <button class="cta soft" id="settingsBtn">⚙️ Settings</button>
  </div>
</div>

<div class="overlay" id="introOv">
  <div class="card">
    <h2 id="introTitle">Level 1</h2>
    <p id="introNote">Drag each jelly to the door of the same colour to let it escape!</p>
    <p id="introTime" style="font-weight:800;color:#173a5e;margin-top:10px"></p>
    <button class="cta main" id="introGo">Let's go!</button>
  </div>
</div>

<div class="overlay" id="winOv">
  <div class="card">
    <h2 id="winTitle">Level complete!</h2>
    <div class="stars" id="winStars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <div class="reward" id="winCoins">+0</div>
    <button class="cta blue" id="doubleBtn">▶ Watch ad: double coins<span class="sub">Prototype: free</span></button>
    <button class="cta main" id="nextBtn">Next level</button>
  </div>
</div>

<div class="overlay" id="failOv">
  <div class="card">
    <h2>Time's up! ⏰</h2>
    <p id="failTxt">So close — keep going?</p>
    <button class="cta gold" id="moreCoins">+30 seconds<span class="sub">60 🪙</span></button>
    <button class="cta blue" id="moreAd">▶ +30 seconds<span class="sub">Real app plays an ad · free in prototype</span></button>
    <button class="cta soft" id="retryBtn">↻ Try again</button>
  </div>
</div>

<div class="overlay" id="setOv">
  <div class="card">
    <h2>Settings</h2>
    <div class="toggle">Music <div class="sw2" id="tMusic"></div></div>
    <div class="toggle">Sound effects <div class="sw2" id="tSound"></div></div>
    <div class="toggle">Vibration <div class="sw2" id="tVib"></div></div>
    <button class="cta main" id="setClose">Done</button>
  </div>
</div>
<div id="toast"></div>
<script>
// ===== Arcade wallet: shared coins, player XP/level, profile, daily counters, lifetime totals =====
// Works standalone (localStorage) and inside the Arcade hub (also syncs to the parent page by postMessage).
const Wallet = (() => {
  const KEY = 'arcade_wallet_v1';
  const inHub = window.parent !== window;
  const MAX_LEVEL = 1000;
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const fresh = () => ({ coins: 150, xp: 0, earned: 0, profile: null, daily: { last: null, streak: 0 }, day: today(), counters: {}, totals: {}, claimed: {}, badges: [] });
  let st = null;
  try { st = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!st || typeof st !== 'object') st = fresh();
  st = Object.assign(fresh(), st);
  const listeners = [];
  function rollDay() { const t = today(); if (st.day !== t) { st.day = t; st.counters = {}; st.claimed = {}; } }
  function save(silent) {
    rollDay();
    try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
    if (inHub && !silent) { try { window.parent.postMessage({ arcade: 'wallet', st }, '*'); } catch (e) {} }
    listeners.forEach(f => { try { f(); } catch (e) {} });
  }
  window.addEventListener('message', e => {
    const d = e.data; if (!d || typeof d !== 'object') return;
    if (d.arcade === 'wallet' && d.st && (e.source === window.parent || (e.source && e.source.parent === window))) {
      st = Object.assign(fresh(), d.st); save(e.source === window.parent);
    }
  });
  const levelOf = xp => Math.min(MAX_LEVEL, Math.floor(Math.sqrt(xp / 60)) + 1);
  const xpFor = L => 60 * (L - 1) * (L - 1);
  return {
    MAX_LEVEL, inHub, today,
    get coins() { return st.coins; },
    set coins(v) { const nv = Math.max(0, Math.round(v)); if (nv > st.coins) st.earned += nv - st.coins; st.coins = nv; save(); },
    addXp(n) { if (n > 0) { st.xp += Math.round(n); save(); } },
    get level() { return levelOf(st.xp); },
    levelProgress() { const L = levelOf(st.xp); if (L >= MAX_LEVEL) return 1; return (st.xp - xpFor(L)) / (xpFor(L + 1) - xpFor(L)); },
    event(name, n = 1) { rollDay(); st.counters[name] = (st.counters[name] || 0) + n; st.totals[name] = (st.totals[name] || 0) + n; save(); },
    eventMax(name, v) { rollDay(); st.counters[name] = Math.max(st.counters[name] || 0, v); st.totals[name] = Math.max(st.totals[name] || 0, v); save(); },
    setGameLevel(game, lvl) { st.totals[game + '_lvl'] = lvl; save(); },
    state() { rollDay(); return st; },
    replace(s) { st = Object.assign(fresh(), s); save(true); },
    commit() { save(); },
    grant(key, n) { st.grants = st.grants || {}; st.grants[key] = (st.grants[key] || 0) + n; save(); },
    take(key) { if (!st.grants || !st.grants[key]) return 0; const n = st.grants[key]; delete st.grants[key]; save(); return n; },
    onChange(f) { listeners.push(f); },
    exit() { if (inHub) window.parent.postMessage({ arcade: 'exit' }, '*'); },
    // Adds a "back to Arcade" button inside a game's start screen when running in the hub.
    addBackButton(container) {
      if (!inHub || !container) return;
      const b = document.createElement('button');
      b.textContent = '⬅ Back to Arcade';
      b.style.cssText = 'display:block;margin:14px auto 0;padding:10px 18px;border-radius:14px;border:0;background:rgba(255,255,255,.18);color:inherit;font:800 14px system-ui,sans-serif;cursor:pointer;backdrop-filter:blur(4px)';
      b.onclick = e => { e.stopPropagation(); Wallet.exit(); };
      container.appendChild(b);
    }
  };
})();

</script>
<script>
// ===== Interactive background (shared by all games) =====
// Floating shapes drift in layers, get pushed away by your finger, pop with a musical note when tapped,
// ripple outwards on taps and on big in-game moments, and shift with parallax. Optional bee mascot.
function InteractiveBG(canvas, opts) {
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1, now = 0;
  let o = Object.assign({ bgA: '#141d3a', bgB: '#060a14', palette: ['#ffffff'], shape: 'bubble', count: 26, aur: null,
    stars: 60, sound: null, mascot: false, glow: 0 }, opts);
  const items = [], ripples = [], sparks = [], starsArr = [];
  for (let i = 0; i < 160; i++) starsArr.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.3 + 0.3, a: Math.random() * 0.6 + 0.2, sp: Math.random() * 1.5 + 0.5, ph: Math.random() * 6.3 });
  const ptr = { x: -9999, y: -9999, down: false, idle: 9, nx: 0, ny: 0 };
  let px = 0, py = 0, energy = 0;
  const hexA = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
  const shapes = ['bubble', 'hex', 'star', 'heart'];

  function spawn(it, initial) {
    it.layer = 0.45 + Math.random() * 0.9;
    it.r = (9 + Math.random() * 20) * it.layer * (W < 500 ? 1 : 1.25);
    it.x = Math.random() * W; it.y = initial ? Math.random() * H : H + it.r * 2;
    it.vx = 0; it.vy = 0; it.base = -(7 + Math.random() * 14) * it.layer;
    it.col = o.palette[Math.floor(Math.random() * o.palette.length)];
    it.kind = o.shape === 'mix' ? shapes[Math.floor(Math.random() * shapes.length)] : o.shape;
    it.ph = Math.random() * 6.28; it.rot = Math.random() * 6.28; it.vr = (Math.random() - 0.5) * 0.5;
    it.dead = 0; it.scale = initial ? 1 : 0; it.hit = 0;
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2); W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); buildScene();
    while (items.length < o.count) { const it = {}; spawn(it, true); items.push(it); }
    items.length = o.count;
  }
  // ---------- Painted scene (layered parallax, cached) ----------
  let scn = null, scnLayers = [], scnName = null, scnFade = 0;
  function buildScene() {
    scnLayers = []; scn = (typeof IBG_SCENES !== 'undefined' && o.scene) ? IBG_SCENES.S[o.scene] : null; if (!scn || !W) return;
    const lw = Math.ceil(W * 1.3), lh = Math.ceil(H);
    for (const [depth, paint] of scn.layers) { const cv = document.createElement('canvas'); cv.width = Math.round(lw * dpr); cv.height = Math.round(lh * dpr); const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); try { paint(g, lw, lh); } catch (e) {} scnLayers.push({ depth, cv, lw, lh }); }
  }
  function setTheme(t) { const prev = o.scene; o = Object.assign(o, t); if (o.scene !== prev) scnFade = 1; items.forEach(it => { it.col = o.palette[Math.floor(Math.random() * o.palette.length)]; if (o.shape !== 'mix') it.kind = o.shape; }); resize(); }

  // ---------- Bee mascot ----------
  const bee = { x: 0, y: 0, t: Math.random() * 100, spin: 0, say: '', sayT: 0, dir: 1, lastX: 0, boost: 0 };
  const SAYS = ['Bzz!', 'Hehe!', 'Wheee!', 'Hi!', 'Boop!', 'Tickles!'];
  function beeSay(s) { bee.say = s; bee.sayT = 1.6; }

  // ---------- Input ----------
  function move(x, y) { ptr.x = x; ptr.y = y; ptr.idle = 0; ptr.nx = x / Math.max(1, W) - 0.5; ptr.ny = y / Math.max(1, H) - 0.5; }
  function tap(x, y) {
    move(x, y);
    if (o.mascot && Math.hypot(x - bee.x, y - bee.y) < 34) {
      bee.spin = 1; bee.boost = 1; beeSay(SAYS[Math.floor(Math.random() * SAYS.length)]);
      burst(bee.x, bee.y, '#ffd23f', 14); ripple(bee.x, bee.y, '#ffd23f', 1);
      o.sound && o.sound('bee'); return true;
    }
    let best = null;
    for (const it of items) {
      if (it.dead > 0) continue;
      const ox = -px * 40 * it.layer, oy = -py * 26 * it.layer;
      if (Math.hypot(x - (it.x + ox), y - (it.y + oy)) < it.r * 1.25 + 8 && (!best || it.layer > best.layer)) best = it;
    }
    if (best) {
      const ox = -px * 40 * best.layer, oy = -py * 26 * best.layer;
      burst(best.x + ox, best.y + oy, best.col, 16); ripple(best.x + ox, best.y + oy, best.col, 0.8);
      best.dead = 1.2 + Math.random();
      o.sound && o.sound('pop', 1 - Math.min(1, best.r / 34));
      return true;
    }
    ripple(x, y, o.palette[0], 0.6); burst(x, y, o.palette[Math.floor(Math.random() * o.palette.length)], 6);
    o.sound && o.sound('tap', Math.random());
    return false;
  }
  function ripple(x, y, col, strength) { ripples.push({ x, y, r: 4, col: col || '#ffffff', s: strength || 1, life: 1 }); }
  function burst(x, y, col, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 220;
      sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, life: 0.5 + Math.random() * 0.5, age: 0, r: 1.5 + Math.random() * 3, col });
    }
  }
  // Big in-game moment: shockwave + energy (brighter, faster)
  function pulse(x, y, strength, col) {
    ripple(x == null ? W / 2 : x, y == null ? H / 2 : y, col || '#ffffff', strength || 1.5);
    energy = Math.min(1.5, energy + (strength || 1) * 0.5);
  }
  function cheer(text) { if (!o.mascot) return; bee.spin = 1; bee.boost = 1; beeSay(text || ['Yay!', 'Wow!', 'Sweet!', 'Amazing!'][Math.floor(Math.random() * 4)]); }

  // ---------- Update ----------
  function update(dt) {
    ptr.idle += dt; energy = Math.max(0, energy - dt * 0.6);
    px += (ptr.nx - px) * Math.min(1, dt * 2.5); py += (ptr.ny - py) * Math.min(1, dt * 2.5);
    const repel = ptr.idle < 0.35 || ptr.down;
    for (const it of items) {
      if (it.dead > 0) { it.dead -= dt; if (it.dead <= 0) spawn(it, false); continue; }
      const ox = -px * 40 * it.layer, oy = -py * 26 * it.layer;
      if (repel) {
        const dx = it.x + ox - ptr.x, dy = it.y + oy - ptr.y, d = Math.hypot(dx, dy) || 1, R = 120;
        if (d < R) { const f = (1 - d / R) * 1100 * dt; it.vx += dx / d * f; it.vy += dy / d * f; it.hit = 1; }
      }
      for (const rp of ripples) {
        const dx = it.x - rp.x, dy = it.y - rp.y, d = Math.hypot(dx, dy) || 1;
        if (Math.abs(d - rp.r) < 26) { const f = 520 * rp.s * rp.life * dt; it.vx += dx / d * f; it.vy += dy / d * f; }
      }
      const spd = 1 + energy * 1.5;
      it.vy += (it.base * spd - it.vy) * dt * 1.1; it.vx *= 1 - dt * 1.4;
      it.x += (it.vx + Math.sin(now * 0.0011 + it.ph) * 7 * it.layer) * dt; it.y += it.vy * dt;
      it.rot += it.vr * dt * spd; it.scale += (1 - it.scale) * Math.min(1, dt * 4); it.hit = Math.max(0, it.hit - dt * 2);

    for (let i = 0; i < 24 && drag; i++) {
      const dx = Math.sign(tx - b.x), dy = Math.sign(ty - b.y);
      if (!dx && !dy) break;
      const first = Math.abs(tx - b.x) >= Math.abs(ty - b.y) ? [dx, 0] : [0, dy], second = first[0] ? [0, dy] : [dx, 0];
      drag.lastX = b.x; drag.lastY = b.y;
      if ((first[0] || first[1]) && step(b, first[0], first[1])) moved++;
      else if ((second[0] || second[1]) && step(b, second[0], second[1])) moved++;
      else { if (moved === 0 && !drag.bumped) { sfx.bump(); b.jig = 0.5; drag.bumped = true; } break; }
      drag.bumped = false;
      sfx.slide(moved);
      const d = exitDoor(b); if (d) { escape(b, d); break; }
    }
  });
  const endDrag = () => { if (drag) { drag.b.jig = 0.7; drag = null; } };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ================= Buttons =================
  const hide = id => $(id).classList.remove('show'), show = id => $(id).classList.add('show');
  $('playBtn').onclick = () => { ac(); startMusic(); hide('homeOv'); takeGrants(); startLevel(); };
  $('introGo').onclick = () => { hide('introOv'); paused = false; sfx.star(1); if (S.level <= 2) setTimeout(() => { if (!started) useHintFree(); }, 1200); };
  function useHintFree() { const h = findHint(); if (h) hint = { b: h.b, path: h.path, t: 0 }; }
  $('homeBtn').onclick = () => { paused = true; syncHud(); show('homeOv'); };
  $('nextBtn').onclick = () => { hide('winOv'); startLevel(); };
  $('doubleBtn').onclick = () => { if (doubled) return; doubled = true; S.coins += lastReward; persist(); $('winCoins').textContent = `+${lastReward * 2} 🪙`; $('doubleBtn').style.display = 'none'; sfx.star(2); syncHud(); };
  $('retryBtn').onclick = () => { hide('failOv'); startLevel(); };
  $('moreCoins').onclick = () => { if (S.coins < 60) { toast(`Need ${60 - S.coins} more coins`); return; } S.coins -= 60; persist(); addTime(); };
  $('moreAd').onclick = () => addTime();
  $('restartBtn').onclick = () => { if (!won) startLevel(); };
  $('hintBtn').onclick = () => { ac(); useHint(); };
  $('freezeBtn').onclick = () => { ac(); useFreeze(); };
  $('settingsBtn').onclick = () => { syncToggles(); show('setOv'); };
  $('setClose').onclick = () => hide('setOv');
  function syncToggles() { [['tMusic', 'music'], ['tSound', 'sound'], ['tVib', 'vib']].forEach(([id, k]) => $(id).classList.toggle('on', !!S[k])); }
  [['tMusic', 'music'], ['tSound', 'sound'], ['tVib', 'vib']].forEach(([id, k]) => { $(id).onclick = () => { S[k] = !S[k]; persist(); syncToggles(); if (k === 'music') { ac(); startMusic(); if (musicGain) musicGain.gain.setTargetAtTime(S.music ? 0.8 : 0, actx.currentTime, 0.15); } }; });

  // ================= Boot =================
  bg = typeof InteractiveBG === 'function' ? InteractiveBG($('bg'), {
    bgA: '#3ec6ff', bgB: '#7af0c0', palette: ['#ffffff', '#ff9db0', '#fff08a', '#a6c8ff', '#d6b2ff'], shape: 'bubble', count: 24, aur: ['#ffffff', '#b2fff0'], stars: 0, mascot: false,
    sound: (type, p) => { ac(); if (type === 'pop' && HAS_W) Wallet.event('bubbles'); if (type === 'pop') { const f = PENT[Math.floor(p * 6) + 2]; tone(f, 0.22, { vol: 0.09 }); tone(f * 1.5, 0.15, { vol: 0.03, delay: 0.04 }); } else tone(PENT[Math.floor(p * 4)], 0.2, { vol: 0.05 }); }
  }) : null;
  $('homeOv').addEventListener('pointerdown', e => { if (e.target === $('homeOv') && bg) { ac(); bg.tap(e.clientX, e.clientY); } });
  if (HAS_W) { Wallet.addBackButton($('homeOv').querySelector('.home')); Wallet.onChange(() => syncHud()); Wallet.setGameLevel('jj', S.level); takeGrants(); Wallet.onChange(takeGrants); }
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  resize(); syncHud();
  requestAnimationFrame(frame);
  window.__jj = { S, get blocks() { return blocks; }, findHint, escapeVia: () => { const h = findHint(); if (!h) return false; const b = h.b; setOcc(b, -1); const [x, y] = h.path[h.path.length - 1]; b.x = x; b.y = y; setOcc(b, b.id); const d = exitDoor(b); escape(b, d); return true; }, startLevel, get won() { return won; } };
})();

</script>
