<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14062f">
<title>Pop Party</title>
<style>
  :root{--text:#2a1450;--muted:#6b5a96;--accent:#ff2bd6;--accent2:#8a5cff;--shadow:rgba(10,0,30,.5);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#14062f;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;}
  #app{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;height:100%;pointer-events:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  #app > *{pointer-events:auto;}
  .topbar{width:100%;max-width:520px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:12px 14px 2px;}
  .ibtn{width:44px;height:44px;border-radius:15px;border:0;background:rgba(255,255,255,.9);color:var(--text);font-size:19px;cursor:pointer;box-shadow:0 4px 0 var(--shadow);}
  .lvl{text-align:center;font-size:19px;font-weight:900;letter-spacing:.05em;color:#fff;text-shadow:0 2px 0 var(--shadow);}
  .coins{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:20px;background:rgba(255,255,255,.9);font-weight:900;font-variant-numeric:tabular-nums;box-shadow:0 4px 0 var(--shadow);}
  .coins .c{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffcf5a 45%,#c48a12);}
  .hud{width:100%;max-width:520px;display:flex;gap:10px;padding:6px 14px 0;align-items:stretch;}
  .moves{flex:none;min-width:78px;border-radius:18px;background:rgba(255,255,255,.92);box-shadow:0 4px 0 var(--shadow);text-align:center;padding:6px 8px;}
  .moves .n{font-size:28px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
  .moves .l{font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:800;}
  .moves.low .n{color:#ff3b5c;animation:tick 1s infinite;}
  @keyframes tick{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .goals{flex:1;display:flex;gap:8px;align-items:center;justify-content:center;border-radius:18px;background:rgba(255,255,255,.92);box-shadow:0 4px 0 var(--shadow);padding:6px 10px;flex-wrap:wrap;}
  .goal{display:flex;align-items:center;gap:6px;font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;}
  .goal canvas{width:30px;height:30px;}
  .goal.done{color:#16a34a;}
  .goal .bar{width:120px;height:12px;border-radius:6px;background:#eee;overflow:hidden;}
  .goal .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s;}
  .gl{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.08em;}
  #stage{position:relative;flex:1;width:100%;max-width:520px;min-height:0;}
  #c{display:block;width:100%;height:100%;}
  .bottombar{display:flex;gap:10px;width:100%;max-width:420px;padding:2px 16px 14px;}
  .tool{flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 4px;border-radius:17px;border:0;
    background:rgba(255,255,255,.92);color:var(--text);font:900 14px system-ui,sans-serif;cursor:pointer;box-shadow:0 5px 0 var(--shadow);transition:transform .1s;}
  .tool:active{transform:translateY(3px);}
  .tool.active{background:#ffd23f;}
  .tool .ic{font-size:20px;}
  .tool b{position:absolute;top:-8px;right:-4px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#ff3b5c;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;}
  .tool b.ad{background:#3a86ff;font-size:10px;}
  .overlay{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(30,10,60,.38);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);}
  .overlay.show{display:flex;animation:pop .3s cubic-bezier(.3,1.5,.5,1);}
  @keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
  .card{background:#fff;border-radius:28px;padding:24px 20px;width:min(90%,360px);text-align:center;box-shadow:0 10px 0 var(--shadow),0 30px 60px rgba(30,10,60,.3);max-height:92%;overflow:auto;}
  .card h2{margin:0 0 6px;font-size:24px;font-weight:900;} .card p{margin:4px 0;color:var(--muted);font-size:14px;}
  .cta{display:block;width:100%;margin-top:12px;padding:15px;border-radius:18px;border:0;font:900 17px system-ui,sans-serif;cursor:pointer;transition:transform .1s;}
  .cta:active{transform:translateY(3px);}
  .main{background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff;box-shadow:0 6px 0 var(--shadow);}
  .gold{background:linear-gradient(180deg,#ffd60a,#ff9f1c);color:#4a2a00;box-shadow:0 6px 0 #c76a00;}
  .blue{background:linear-gradient(180deg,#5fb0ff,#3a6cff);color:#fff;box-shadow:0 6px 0 #2340b0;}
  .soft{background:#f3efff;color:var(--text);box-shadow:0 6px 0 #d6cdf5;}
  .sub{display:block;font-size:12px;font-weight:700;opacity:.8;margin-top:2px;}
  .stars{display:flex;justify-content:center;gap:10px;margin:12px 0 6px;}
  .stars span{font-size:48px;filter:grayscale(1) brightness(1.4) opacity(.4);transform:scale(.4);transition:all .4s cubic-bezier(.3,1.8,.5,1);}
  .stars span.on{filter:none;transform:scale(1);}
  .reward{font-size:28px;font-weight:900;color:#e08a00;margin:6px 0;}
  .home{text-align:center;width:min(92%,360px);}
  .title{font-size:50px;font-weight:900;line-height:.95;color:#fff;text-shadow:0 4px 0 var(--accent),0 8px 0 var(--shadow),0 14px 24px rgba(30,10,60,.35);}
  .tagline{color:#fff;font-weight:800;margin:14px 0 20px;letter-spacing:.14em;font-size:13px;text-shadow:0 2px 0 var(--shadow);}
  #logoCanvas{width:260px;height:80px;display:block;margin:0 auto 10px;}
  .goalbig{display:flex;justify-content:center;gap:14px;margin:12px 0;flex-wrap:wrap;}
  .goalbig .goal{font-size:22px;}
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 130px);transform:translate(-50%,-20px);opacity:0;z-index:30;pointer-events:none;
    background:#fff;padding:11px 18px;border-radius:16px;font-size:14px;font-weight:800;max-width:90%;text-align:center;transition:all .3s;box-shadow:0 6px 0 var(--shadow),0 10px 30px rgba(30,10,60,.25);}
  #toast.show{opacity:1;transform:translate(-50%,0);}
  .toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid #eee8ff;font-size:16px;font-weight:700;}
  .sw2{width:50px;height:30px;border-radius:15px;background:#d9d2f5;position:relative;cursor:pointer;transition:background .2s;}
  .sw2::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.2);}
  .sw2.on{background:#3ddc84;} .sw2.on::after{left:23px;}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">
  <div class="topbar">
    <button class="ibtn" id="homeBtn" aria-label="Home">🏠</button>
    <div class="lvl" id="lvlTitle">LEVEL 1</div>
    <div class="coins"><span class="c"></span><span id="coinTxt">0</span></div>
  </div>
  <div class="hud">
    <div class="moves" id="movesBox"><div class="n" id="movesTxt">0</div><div class="l">MOVES</div></div>
    <div class="goals" id="goals"></div>
  </div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div class="bottombar">
    <button class="tool" id="tool1Btn"><span class="ic">🔨</span>Hammer<b id="tool1B">2</b></button>
    <button class="tool" id="tool2Btn"><span class="ic">🔀</span>Shuffle<b id="tool2B">2</b></button>
  </div>
</div>

<div class="overlay show" id="homeOv">
  <div class="home">
    <canvas id="logoCanvas" width="520" height="160"></canvas>
    <div class="title">POP<br>PARTY</div>
    <div class="tagline">TAP · POP · DANCE</div>
    <button class="cta gold" id="playBtn" style="font-size:21px;padding:18px">Play<span class="sub" id="playSub">Level 1</span></button>
    <button class="cta soft" id="settingsBtn">⚙️ Settings</button>
  </div>
</div>

<div class="overlay" id="introOv">
  <div class="card">
    <h2 id="introTitle">Level 1</h2>
    <p id="introNote"></p>
    <div class="goalbig" id="introGoals"></div>
    <p id="introMoves" style="font-weight:800;color:#2a1450"></p>
    <button class="cta main" id="introGo">Let's go!</button>
  </div>
</div>

<div class="overlay" id="winOv">
  <div class="card">
    <h2 id="winTitle">Level complete!</h2>
    <div class="stars" id="winStars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <p id="winScore"></p>
    <div class="reward" id="winCoins">+0</div>
    <button class="cta blue" id="doubleBtn">▶ Watch ad: double coins<span class="sub">Prototype: free</span></button>
    <button class="cta main" id="nextBtn">Next level</button>
  </div>
</div>

<div class="overlay" id="failOv">
  <div class="card">
    <h2>Out of moves!</h2>
    <p id="failTxt">So close — keep going?</p>
    <button class="cta gold" id="moreCoins">+5 moves<span class="sub">60 🪙</span></button>
    <button class="cta blue" id="moreAd">▶ +5 moves<span class="sub">Real app plays an ad · free in prototype</span></button>
    <button class="cta soft" id="retryBtn">↻ Try again</button>
  </div>
</div>

<div class="overlay" id="setOv">
  <div class="card">
    <h2>Settings</h2>
    <div class="toggle">Music <div class="sw2" id="tMusic"></div></div>
    <div class="toggle">Sound effects <div class="sw2" id="tSound"></div></div>
    <div class="toggle">Vibration <div class="sw2" id="tVib"></div></div>
    <button class="cta main" id="setClose">Done</button>
  </div>
</div>
<div id="toast"></div>
<script>
// ===== Arcade wallet: shared coins, player XP/level, profile, daily counters, lifetime totals =====
// Works standalone (localStorage) and inside the Arcade hub (also syncs to the parent page by postMessage).
const Wallet = (() => {
  const KEY = 'arcade_wallet_v1';
  const inHub = window.parent !== window;
  const MAX_LEVEL = 1000;
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const fresh = () => ({ coins: 150, xp: 0, earned: 0, profile: null, daily: { last: null, streak: 0 }, day: today(), counters: {}, totals: {}, claimed: {}, badges: [] });
  let st = null;
  try { st = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!st || typeof st !== 'object') st = fresh();
  st = Object.assign(fresh(), st);
  const listeners = [];
  function rollDay() { const t = today(); if (st.day !== t) { st.day = t; st.counters = {}; st.claimed = {}; } }
  function save(silent) {
    rollDay();
    try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
    if (inHub && !silent) { try { window.parent.postMessage({ arcade: 'wallet', st }, '*'); } catch (e) {} }
    listeners.forEach(f => { try { f(); } catch (e) {} });
  }
  window.addEventListener('message', e => {
    const d = e.data; if (!d || typeof d !== 'object') return;
    if (d.arcade === 'wallet' && d.st && (e.source === window.parent || (e.source && e.source.parent === window))) {
      st = Object.assign(fresh(), d.st); save(e.source === window.parent);
    }
  });
  const levelOf = xp => Math.min(MAX_LEVEL, Math.floor(Math.sqrt(xp / 60)) + 1);
  const xpFor = L => 60 * (L - 1) * (L - 1);
  return {
    MAX_LEVEL, inHub, today,
    get coins() { return st.coins; },
    set coins(v) { const nv = Math.max(0, Math.round(v)); if (nv > st.coins) st.earned += nv - st.coins; st.coins = nv; save(); },
    addXp(n) { if (n > 0) { st.xp += Math.round(n); save(); } },
    get level() { return levelOf(st.xp); },
    levelProgress() { const L = levelOf(st.xp); if (L >= MAX_LEVEL) return 1; return (st.xp - xpFor(L)) / (xpFor(L + 1) - xpFor(L)); },
    event(name, n = 1) { rollDay(); st.counters[name] = (st.counters[name] || 0) + n; st.totals[name] = (st.totals[name] || 0) + n; save(); },
    eventMax(name, v) { rollDay(); st.counters[name] = Math.max(st.counters[name] || 0, v); st.totals[name] = Math.max(st.totals[name] || 0, v); save(); },
    setGameLevel(game, lvl) { st.totals[game + '_lvl'] = lvl; save(); },
    state() { rollDay(); return st; },
    replace(s) { st = Object.assign(fresh(), s); save(true); },
    commit() { save(); },
    grant(key, n) { st.grants = st.grants || {}; st.grants[key] = (st.grants[key] || 0) + n; save(); },
    take(key) { if (!st.grants || !st.grants[key]) return 0; const n = st.grants[key]; delete st.grants[key]; save(); return n; },
    onChange(f) { listeners.push(f); },
    exit() { if (inHub) window.parent.postMessage({ arcade: 'exit' }, '*'); },
    // Adds a "back to Arcade" button inside a game's start screen when running in the hub.
    addBackButton(container) {
      if (!inHub || !container) return;
      const b = document.createElement('button');
      b.textContent = '⬅ Back to Arcade';
      b.style.cssText = 'display:block;margin:14px auto 0;padding:12px 22px;border-radius:16px;border:0;background:rgba(255,255,255,.22);color:inherit;font:900 15px system-ui,sans-serif;cursor:pointer;backdrop-filter:blur(4px)';
      b.onclick = e => { e.stopPropagation(); Wallet.exit(); };
      container.appendChild(b);
      // plus a big, always-visible pill in the top-left corner of the game's start screen (below the notch)
      const ov = container.closest('.overlay') || container.parentElement;
      if (ov && !ov.querySelector('.arcBack')) {
        const t = document.createElement('button'); t.className = 'arcBack'; t.innerHTML = '⬅ Arcade';
        t.style.cssText = 'position:absolute;z-index:50;left:max(12px,env(safe-area-inset-left));top:calc(env(safe-area-inset-top) + 12px);min-height:48px;padding:0 20px;border-radius:24px;border:0;background:linear-gradient(#ffe36b,#ffb21a);color:#3a1a00;font:900 17px system-ui,sans-serif;box-shadow:0 4px 0 #b86b00,0 6px 18px rgba(0,0,0,.35);cursor:pointer';
        t.onclick = e => { e.stopPropagation(); Wallet.exit(); };
        if (getComputedStyle(ov).position === 'static') ov.style.position = 'relative';
        ov.appendChild(t);
      }
    }
  };
})();

// ===== One Music / Sound setting for the whole arcade =====
// Every game keeps its own save with music/sound flags. Before a game starts we copy the arcade-wide choice into it,
// and add a quick 🎵 button next to the 🏠 button that flips music in any game (and everywhere else too).
(() => {
  const KEY = 'arcade_audio';
  let A = { music: true, sound: true };
  try { A = Object.assign(A, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
  const saveA = () => { try { localStorage.setItem(KEY, JSON.stringify(A)); } catch (e) {} };
  try { // sync every game save that has music/sound flags
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k === KEY || k === 'arcade_wallet_v1') continue;
      let v; try { v = JSON.parse(localStorage.getItem(k)); } catch (e) { continue; }
      if (v && typeof v === 'object' && ('music' in v || 'sound' in v)) { v.music = A.music; v.sound = A.sound; localStorage.setItem(k, JSON.stringify(v)); } }
  } catch (e) {}
  window.ArcadeAudio = { get: () => A };
  const wire = () => {
    const home = document.getElementById('homeBtn'), tm = document.getElementById('tMusic'), ts = document.getElementById('tSound');
    // the game's own Settings switches also update the arcade-wide choice
    if (tm) tm.addEventListener('click', () => { A.music = !A.music; saveA(); paint(); });
    if (ts) ts.addEventListener('click', () => { A.sound = !A.sound; saveA(); });
    if (!home || !tm || document.getElementById('musicQuick')) return;
    const q = document.createElement('button'); q.id = 'musicQuick'; q.className = home.className; q.setAttribute('aria-label', 'Music on or off');
    q.style.marginLeft = '8px';
    const paint = () => { q.textContent = A.music ? '🎵' : '🔇'; q.style.opacity = A.music ? '1' : '.75'; };
    window.__paintMusic = paint; paint();
    q.onclick = e => { e.stopPropagation(); tm.click(); const T = document.getElementById('toast'); if (T) { T.textContent = A.music ? '🎵 Music on' : '🔇 Music off'; T.classList.add('show'); setTimeout(() => T.classList.remove('show'), 1500); } };
    home.insertAdjacentElement('afterend', q);
    // keep the home + music buttons together on the left of the top bar
    if (home.parentElement && !home.parentElement.querySelector('.lbtns')) { const w = document.createElement('div'); w.className = 'lbtns'; w.style.cssText = 'display:flex;align-items:center;flex:0 0 auto'; home.parentElement.insertBefore(w, home); w.appendChild(home); w.appendChild(q); }
  };
  function paint() { if (window.__paintMusic) window.__paintMusic(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire); else setTimeout(wire, 0);
})();


</script>
<script>
// ===== Interactive background (shared by all games) =====
// Floating shapes drift in layers, get pushed away by your finger, pop with a musical note when tapped,
// ripple outwards on taps and on big in-game moments, and shift with parallax. Optional bee mascot.
function InteractiveBG(canvas, opts) {
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1, now = 0;
  let o = Object.assign({ bgA: '#141d3a', bgB: '#060a14', palette: ['#ffffff'], shape: 'bubble', count: 26, aur: null,
    stars: 60, sound: null, mascot: false, glow: 0 }, opts);
  const items = [], ripples = [], sparks = [], starsArr = [];
  for (let i = 0; i < 160; i++) starsArr.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.3 + 0.3, a: Math.random() * 0.6 + 0.2, sp: Math.random() * 1.5 + 0.5, ph: Math.random() * 6.3 });
  const ptr = { x: -9999, y: -9999, down: false, idle: 9, nx: 0, ny: 0 };
  let px = 0, py = 0, energy = 0;
  const hexA = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
  const shapes = ['bubble', 'hex', 'star', 'heart'];

  function spawn(it, initial) {
    it.layer = 0.45 + Math.random() * 0.9;
    it.r = (9 + Math.random() * 20) * it.layer * (W < 500 ? 1 : 1.25);
    it.x = Math.random() * W; it.y = initial ? Math.random() * H : H + it.r * 2;
    it.vx = 0; it.vy = 0; it.base = -(7 + Math.random() * 14) * it.layer;
    it.col = o.palette[Math.floor(Math.random() * o.palette.length)];
    it.kind = o.shape === 'mix' ? shapes[Math.floor(Math.random() * shapes.length)] : o.shape;
    it.ph = Math.random() * 6.28; it.rot = Math.random() * 6.28; it.vr = (Math.random() - 0.5) * 0.5;
    it.dead = 0; it.scale = initial ? 1 : 0; it.hit = 0;
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2); W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); buildScene();
    while (items.length < o.count) { const it = {}; spawn(it, true); items.push(it); }
    items.length = o.count;
  }
  // ---------- Painted scene (layered parallax, cached) ----------
  let scn = null, scnLayers = [], scnName = null, scnFade = 0;
  function buildScene() {
    scnLayers = []; scn = (typeof IBG_SCENES !== 'undefined' && o.scene) ? IBG_SCENES.S[o.scene] : null; if (!scn || !W) return;
    const lw = Math.ceil(W * 1.3), lh = Math.ceil(H);
    for (const [depth, paint] of scn.layers) { const cv = document.createElement('canvas'); cv.width = Math.round(lw * dpr); cv.height = Math.round(lh * dpr); const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); try { paint(g, lw, lh); } catch (e) {} scnLayers.push({ depth, cv, lw, lh }); }
  }
  function setTheme(t) { const prev = o.scene; o = Object.assign(o, t); if (o.scene !== prev) scnFade = 1; items.forEach(it => { it.col = o.palette[Math.floor(Math.random() * o.palette.length)]; if (o.shape !== 'mix') it.kind = o.shape; }); resize(); }

  // ---------- Bee mascot ----------
  const bee = { x: 0, y: 0, t: Math.random() * 100, spin: 0, say: '', sayT: 0, dir: 1, lastX: 0, boost: 0 };
  const SAYS = ['Bzz!', 'Hehe!', 'Wheee!', 'Hi!', 'Boop!', 'Tickles!'];
  function beeSay(s) { bee.say = s; bee.sayT = 1.6; }

  // ---------- Input ----------
  function move(x, y) { ptr.x = x; ptr.y = y; ptr.idle = 0; ptr.nx = x / Math.max(1, W) - 0.5; ptr.ny = y / Math.max(1, H) - 0.5; }
  function tap(x, y) {
    move(x, y);
    if (o.mascot && Math.hypot(x - bee.x, y - bee.y) < 34) {
      bee.spin = 1; bee.boost = 1; beeSay(SAYS[Math.floor(Math.random() * SAYS.length)]);
      burst(bee.x, bee.y, '#ffd23f', 14); ripple(bee.x, bee.y, '#ffd23f', 1);
      o.sound && o.sound('bee'); return true;
    }
    let best = null;
    for (const it of items) {
