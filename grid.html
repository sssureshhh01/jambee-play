<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>Midnight Grid</title>
<style>
  :root{--text:#e8ecf7;--muted:#8a93b3;--amber:#ffb547;--panel:rgba(15,21,40,.92);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#070b16;color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;}
  #app{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;height:100%;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  header{width:100%;max-width:480px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 18px 2px;}
  .stat{display:flex;flex-direction:column;}
  .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  .value{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;}
  .mid{align-items:center;}
  #best{font-size:18px;color:var(--amber);}
  .btns{display:flex;justify-content:flex-end;}
  button.icon{width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(15,21,40,.75);color:var(--text);font-size:18px;cursor:pointer;}
  #lvlrow{width:100%;max-width:480px;display:flex;align-items:center;gap:10px;padding:4px 18px 0;}
  #lvl{font-size:12px;font-weight:800;color:#1a0f05;background:var(--amber);padding:3px 8px;border-radius:8px;white-space:nowrap;}
  .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb547,#ff7a59);border-radius:3px;transition:width .4s;}
  #xptext{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
  #stage{position:relative;flex:1;width:100%;max-width:480px;min-height:0;}
  #c{display:block;width:100%;height:100%;}
  #powerbar{display:flex;gap:10px;width:100%;max-width:480px;padding:4px 16px 12px;}
  .pw{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;border-radius:14px;
    border:1px solid rgba(255,255,255,.09);background:rgba(15,21,40,.78);color:var(--text);font-family:inherit;cursor:pointer;transition:transform .1s;}
  .pw:active{transform:scale(.95);}
  .pw .ic{font-size:21px;line-height:1;}
  .pw .nm{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}
  .pw b{position:absolute;top:-7px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--amber);color:#1a0f05;font-size:12px;display:flex;align-items:center;justify-content:center;}
  .pw b.ad{background:#3fd6e8;font-size:10px;}
  .pw.active{border-color:#ff7a59;box-shadow:0 0 0 2px rgba(255,122,89,.55),0 0 22px rgba(255,122,89,.45);}
  .overlay{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(5,8,18,.72);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);}
  .overlay.show{display:flex;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{background:var(--panel);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:24px 22px;width:min(88%,350px);text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.55);max-height:90%;overflow:auto;}
  .card h2{margin:0 0 6px;font-size:21px;}
  .card p{margin:4px 0;color:var(--muted);font-size:14px;}
  .big{font-size:46px;font-weight:800;margin:8px 0 2px;font-variant-numeric:tabular-nums;}
  .cta{display:block;width:100%;margin-top:11px;padding:14px;border-radius:14px;border:0;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;}
  .primary{background:linear-gradient(135deg,#ffb547,#ff7a59);color:#1a0f05;box-shadow:0 8px 24px rgba(255,122,89,.3);}
  .secondary{background:rgba(30,40,75,.9);color:var(--text);border:1px solid rgba(255,255,255,.1);}
  .note{font-size:12px !important;opacity:.85;}
  .pwrow{display:flex;gap:8px;margin-top:10px;}
  .pwrow button{flex:1;padding:10px 4px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(30,40,75,.9);color:var(--text);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
  .section{text-align:left;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;}
  .themes{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .theme{position:relative;padding:10px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(20,28,55,.9);color:var(--text);font-family:inherit;cursor:pointer;text-align:left;}
  .theme.sel{border-color:var(--amber);box-shadow:0 0 0 2px rgba(255,181,71,.4);}
  .theme .sw{height:34px;border-radius:9px;margin-bottom:7px;}
  .theme .tn{font-size:13px;font-weight:700;}
  .theme .lk{position:absolute;inset:0;border-radius:14px;background:rgba(5,8,18,.72);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);}
  .row2{display:flex;gap:10px;}
  .row2 .cta{font-size:14px;}
  .start{text-align:center;width:min(90%,360px);}
  .logo .l1{font-size:22px;font-weight:800;letter-spacing:.42em;margin-left:.42em;color:#cfd6ee;text-shadow:0 0 18px rgba(160,180,255,.5);}
  .logo .l2{display:flex;justify-content:center;gap:9px;margin:14px 0 10px;}
  .logo .l2 span{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:rgba(10,10,20,.82);
    animation:bob 2.6s ease-in-out infinite;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),inset 0 6px 0 rgba(255,255,255,.25),0 0 26px var(--g,rgba(255,181,71,.4));}
  .logo .l2 span:nth-child(2){animation-delay:.15s}.logo .l2 span:nth-child(3){animation-delay:.3s}.logo .l2 span:nth-child(4){animation-delay:.45s}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(-3deg)}}
  .tag{color:var(--muted);margin:8px 0 18px;font-size:15px;}
  .lvlchip{display:inline-block;padding:6px 14px;border-radius:20px;background:rgba(255,181,71,.14);color:var(--amber);font-weight:700;font-size:13px;margin-bottom:8px;}
  .big2{font-size:19px;padding:17px;}
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 92px);transform:translate(-50%,-20px);opacity:0;z-index:20;pointer-events:none;
    background:rgba(15,21,40,.95);border:1px solid rgba(255,255,255,.12);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:88%;text-align:center;transition:all .3s;box-shadow:0 10px 30px rgba(0,0,0,.4);}
  #toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">
  <header>
    <div class="stat"><span class="label">Score</span><span class="value" id="score">0</span></div>
    <div class="stat mid"><span class="label">Best</span><span class="value" id="best">0</span></div>
    <div class="btns"><button class="icon" id="menuBtn" aria-label="Menu">☰</button></div>
  </header>
  <div id="lvlrow"><span id="lvl">LV 1</span><div class="bar"><i id="xpbar"></i></div><span id="xptext">0 / 400</span></div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="powerbar">
    <button class="pw" id="pwRotate"><span class="ic">🔄</span><span class="nm">Rotate</span><b id="cRotate">0</b></button>
    <button class="pw" id="pwBomb"><span class="ic">💣</span><span class="nm">Bomb</span><b id="cBomb">0</b></button>
    <button class="pw" id="pwShuffle"><span class="ic">🎲</span><span class="nm">Shuffle</span><b id="cShuffle">0</b></button>
  </div>
</div>

<div class="overlay show" id="startOverlay">
  <div class="start">
    <div class="logo"><div class="l1">MIDNIGHT</div><div class="l2" id="logoTiles"><span>G</span><span>R</span><span>I</span><span>D</span></div></div>
    <p class="tag">Drop blocks. Clear lines. Chain combos.</p>
    <div class="lvlchip" id="startLvl">Level 1</div>
    <button class="cta primary big2" id="playBtn">Play</button>
    <button class="cta secondary" id="startThemes">🎨 Themes</button>
  </div>
</div>

<div class="overlay" id="overOverlay">
  <div class="card">
    <h2>No more moves</h2>
    <p id="newBest" style="color:var(--amber);display:none;font-weight:700">★ New best!</p>
    <div class="big" id="finalScore">0</div>
    <p>Best: <span id="finalBest">0</span></p>
        <p id="coinEarn" style="color:var(--amber);font-weight:700"></p>
    <div class="pwrow" id="overPw"></div>
    <button class="cta primary" id="reviveBtn">▶ Second chance</button>
    <p class="note" id="reviveNote">Clears the middle of the board. In the real app this plays a rewarded ad.</p>
    <button class="cta secondary" id="againBtn">Play again</button>
  </div>
</div>

<div class="overlay" id="menuOverlay">
  <div class="card">
    <h2>Menu</h2>
    <div class="section">Themes</div>
    <div class="themes" id="themeGrid"></div>
    <div class="section">Settings</div>
    <div class="row2">
      <button class="cta secondary" id="musicBtn">🎵 Music</button>
      <button class="cta secondary" id="soundBtn">🔊 Sound</button>
    </div>
    <button class="cta secondary" id="newGameBtn">↻ New game</button>
    <button class="cta primary" id="closeMenu">Resume</button>
  </div>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="card">
    <h2>Start a new game?</h2>
    <p>Your current score will be lost.</p>
    <button class="cta primary" id="confirmYes">New game</button>
    <button class="cta secondary" id="confirmNo">Keep playing</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ===== Arcade wallet: shared coins, player XP/level, profile, daily counters, lifetime totals =====
// Works standalone (localStorage) and inside the Arcade hub (also syncs to the parent page by postMessage).
const Wallet = (() => {
  const KEY = 'arcade_wallet_v1';
  const inHub = window.parent !== window;
  const MAX_LEVEL = 1000;
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const fresh = () => ({ coins: 150, xp: 0, earned: 0, profile: null, daily: { last: null, streak: 0 }, day: today(), counters: {}, totals: {}, claimed: {}, badges: [] });
  let st = null;
  try { st = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!st || typeof st !== 'object') st = fresh();
  st = Object.assign(fresh(), st);
  const listeners = [];
  function rollDay() { const t = today(); if (st.day !== t) { st.day = t; st.counters = {}; st.claimed = {}; } }
  function save(silent) {
    rollDay();
    try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
    if (inHub && !silent) { try { window.parent.postMessage({ arcade: 'wallet', st }, '*'); } catch (e) {} }
    listeners.forEach(f => { try { f(); } catch (e) {} });
  }
  window.addEventListener('message', e => {
    const d = e.data; if (!d || typeof d !== 'object') return;
    if (d.arcade === 'wallet' && d.st && (e.source === window.parent || (e.source && e.source.parent === window))) {
      st = Object.assign(fresh(), d.st); save(e.source === window.parent);
    }
  });
  const levelOf = xp => Math.min(MAX_LEVEL, Math.floor(Math.sqrt(xp / 60)) + 1);
  const xpFor = L => 60 * (L - 1) * (L - 1);
  return {
    MAX_LEVEL, inHub, today,
    get coins() { return st.coins; },
    set coins(v) { const nv = Math.max(0, Math.round(v)); if (nv > st.coins) st.earned += nv - st.coins; st.coins = nv; save(); },
    addXp(n) { if (n > 0) { st.xp += Math.round(n); save(); } },
    get level() { return levelOf(st.xp); },
    levelProgress() { const L = levelOf(st.xp); if (L >= MAX_LEVEL) return 1; return (st.xp - xpFor(L)) / (xpFor(L + 1) - xpFor(L)); },
    event(name, n = 1) { rollDay(); st.counters[name] = (st.counters[name] || 0) + n; st.totals[name] = (st.totals[name] || 0) + n; save(); },
    eventMax(name, v) { rollDay(); st.counters[name] = Math.max(st.counters[name] || 0, v); st.totals[name] = Math.max(st.totals[name] || 0, v); save(); },
    setGameLevel(game, lvl) { st.totals[game + '_lvl'] = lvl; save(); },
    state() { rollDay(); return st; },
    replace(s) { st = Object.assign(fresh(), s); save(true); },
    commit() { save(); },
    grant(key, n) { st.grants = st.grants || {}; st.grants[key] = (st.grants[key] || 0) + n; save(); },
    take(key) { if (!st.grants || !st.grants[key]) return 0; const n = st.grants[key]; delete st.grants[key]; save(); return n; },
    onChange(f) { listeners.push(f); },
    exit() { if (inHub) window.parent.postMessage({ arcade: 'exit' }, '*'); },
    // Adds a "back to Arcade" button inside a game's start screen when running in the hub.
    addBackButton(container) {
      if (!inHub || !container) return;
      const b = document.createElement('button');
      b.textContent = '⬅ Back to Arcade';
      b.style.cssText = 'display:block;margin:14px auto 0;padding:12px 22px;border-radius:16px;border:0;background:rgba(255,255,255,.22);color:inherit;font:900 15px system-ui,sans-serif;cursor:pointer;backdrop-filter:blur(4px)';
      b.onclick = e => { e.stopPropagation(); Wallet.exit(); };
      container.appendChild(b);
      // plus a big, always-visible pill in the top-left corner of the game's start screen (below the notch)
      const ov = container.closest('.overlay') || container.parentElement;
      if (ov && !ov.querySelector('.arcBack')) {
        const t = document.createElement('button'); t.className = 'arcBack'; t.innerHTML = '⬅ Arcade';
        t.style.cssText = 'position:absolute;z-index:50;left:max(12px,env(safe-area-inset-left));top:calc(env(safe-area-inset-top) + 12px);min-height:48px;padding:0 20px;border-radius:24px;border:0;background:linear-gradient(#ffe36b,#ffb21a);color:#3a1a00;font:900 17px system-ui,sans-serif;box-shadow:0 4px 0 #b86b00,0 6px 18px rgba(0,0,0,.35);cursor:pointer';
        t.onclick = e => { e.stopPropagation(); Wallet.exit(); };
        if (getComputedStyle(ov).position === 'static') ov.style.position = 'relative';
        ov.appendChild(t);
      }
    }
  };
})();

// ===== One Music / Sound setting for the whole arcade =====
// Every game keeps its own save with music/sound flags. Before a game starts we copy the arcade-wide choice into it,
// and add a quick 🎵 button next to the 🏠 button that flips music in any game (and everywhere else too).
(() => {
  const KEY = 'arcade_audio';
  let A = { music: true, sound: true };
  try { A = Object.assign(A, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
  const saveA = () => { try { localStorage.setItem(KEY, JSON.stringify(A)); } catch (e) {} };
  try { // sync every game save that has music/sound flags
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k === KEY || k === 'arcade_wallet_v1') continue;
      let v; try { v = JSON.parse(localStorage.getItem(k)); } catch (e) { continue; }
      if (v && typeof v === 'object' && ('music' in v || 'sound' in v)) { v.music = A.music; v.sound = A.sound; localStorage.setItem(k, JSON.stringify(v)); } }
  } catch (e) {}
  window.ArcadeAudio = { get: () => A };
  const wire = () => {
    const home = document.getElementById('homeBtn'), tm = document.getElementById('tMusic'), ts = document.getElementById('tSound');
    // the game's own Settings switches also update the arcade-wide choice
    if (tm) tm.addEventListener('click', () => { A.music = !A.music; saveA(); paint(); });
    if (ts) ts.addEventListener('click', () => { A.sound = !A.sound; saveA(); });
    if (!home || !tm || document.getElementById('musicQuick')) return;
    const q = document.createElement('button'); q.id = 'musicQuick'; q.className = home.className; q.setAttribute('aria-label', 'Music on or off');
    q.style.marginLeft = '8px';
    const paint = () => { q.textContent = A.music ? '🎵' : '🔇'; q.style.opacity = A.music ? '1' : '.75'; };
    window.__paintMusic = paint; paint();
    q.onclick = e => { e.stopPropagation(); tm.click(); const T = document.getElementById('toast'); if (T) { T.textContent = A.music ? '🎵 Music on' : '🔇 Music off'; T.classList.add('show'); setTimeout(() => T.classList.remove('show'), 1500); } };
    home.insertAdjacentElement('afterend', q);
    // keep the home + music buttons together on the left of the top bar
    if (home.parentElement && !home.parentElement.querySelector('.lbtns')) { const w = document.createElement('div'); w.className = 'lbtns'; w.style.cssText = 'display:flex;align-items:center;flex:0 0 auto'; home.parentElement.insertBefore(w, home); w.appendChild(home); w.appendChild(q); }
  };
  function paint() { if (window.__paintMusic) window.__paintMusic(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire); else setTimeout(wire, 0);
})();


</script>
<script>
// ===== Interactive background (shared by all games) =====
// Floating shapes drift in layers, get pushed away by your finger, pop with a musical note when tapped,
// ripple outwards on taps and on big in-game moments, and shift with parallax. Optional bee mascot.
function InteractiveBG(canvas, opts) {
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1, now = 0;
  let o = Object.assign({ bgA: '#141d3a', bgB: '#060a14', palette: ['#ffffff'], shape: 'bubble', count: 26, aur: null,
    stars: 60, sound: null, mascot: false, glow: 0 }, opts);
  const items = [], ripples = [], sparks = [], starsArr = [];
  for (let i = 0; i < 160; i++) starsArr.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.3 + 0.3, a: Math.random() * 0.6 + 0.2, sp: Math.random() * 1.5 + 0.5, ph: Math.random() * 6.3 });
  const ptr = { x: -9999, y: -9999, down: false, idle: 9, nx: 0, ny: 0 };
  let px = 0, py = 0, energy = 0;
  const hexA = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
  const shapes = ['bubble', 'hex', 'star', 'heart'];

  function spawn(it, initial) {
    it.layer = 0.45 + Math.random() * 0.9;
    it.r = (9 + Math.random() * 20) * it.layer * (W < 500 ? 1 : 1.25);
    it.x = Math.random() * W; it.y = initial ? Math.random() * H : H + it.r * 2;
    it.vx = 0; it.vy = 0; it.base = -(7 + Math.random() * 14) * it.layer;
    it.col = o.palette[Math.floor(Math.random() * o.palette.length)];
    it.kind = o.shape === 'mix' ? shapes[Math.floor(Math.random() * shapes.length)] : o.shape;
    it.ph = Math.random() * 6.28; it.rot = Math.random() * 6.28; it.vr = (Math.random() - 0.5) * 0.5;
    it.dead = 0; it.scale = initial ? 1 : 0; it.hit = 0;
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2); W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); buildScene();
    while (items.length < o.count) { const it = {}; spawn(it, true); items.push(it); }
    items.length = o.count;
  }
  // ---------- Painted scene (layered parallax, cached) ----------
  let scn = null, scnLayers = [], scnName = null, scnFade = 0;
  function buildScene() {
    scnLayers = []; scn = (typeof IBG_SCENES !== 'undefined' && o.scene) ? IBG_SCENES.S[o.scene] : null; if (!scn || !W) return;
    const lw = Math.ceil(W * 1.3), lh = Math.ceil(H);
    for (const [depth, paint] of scn.layers) { const cv = document.createElement('canvas'); cv.width = Math.round(lw * dpr); cv.height = Math.round(lh * dpr); const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); try { paint(g, lw, lh); } catch (e) {} scnLayers.push({ depth, cv, lw, lh }); }
  }
  function setTheme(t) { const prev = o.scene; o = Object.assign(o, t); if (o.scene !== prev) scnFade = 1; items.forEach(it => { it.col = o.palette[Math.floor(Math.random() * o.palette.length)]; if (o.shape !== 'mix') it.kind = o.shape; }); resize(); }

  // ---------- Bee mascot ----------
  const bee = { x: 0, y: 0, t: Math.random() * 100, spin: 0, say: '', sayT: 0, dir: 1, lastX: 0, boost: 0 };
  const SAYS = ['Bzz!', 'Hehe!', 'Wheee!', 'Hi!', 'Boop!', 'Tickles!'];
  function beeSay(s) { bee.say = s; bee.sayT = 1.6; }

  // ---------- Input ----------
  function move(x, y) { ptr.x = x; ptr.y = y; ptr.idle = 0; ptr.nx = x / Math.max(1, W) - 0.5; ptr.ny = y / Math.max(1, H) - 0.5; }
  function tap(x, y) {
    move(x, y);
    if (o.mascot && Math.hypot(x - bee.x, y - bee.y) < 34) {
      bee.spin = 1; bee.boost = 1; beeSay(SAYS[Math.floor(Math.random() * SAYS.length)]);
      burst(bee.x, bee.y, '#ffd23f', 14); ripple(bee.x, bee.y, '#ffd23f', 1);
      o.sound && o.sound('bee'); return true;
    }
    let best = null;
    for (const it of items) {

      const rg = ctx.createLinearGradient(0, by - 8, 0, by + boardSize + 8); rg.addColorStop(0, 'rgba(235,240,255,0.75)'); rg.addColorStop(0.5, hexA(theme.aur[0], 0.35)); rg.addColorStop(1, hexA(theme.aur[1] || theme.aur[0], 0.55));
      ctx.save(); ctx.strokeStyle = rg; ctx.lineWidth = 2; rr(bx - 7, by - 7, boardSize + 14, boardSize + 14, cell * 0.36); ctx.stroke();
      const mx = bx + boardSize * (0.5 + 0.45 * Math.sin(now / 5000)), mg = ctx.createRadialGradient(mx, by - 8, 0, mx, by - 8, boardSize * 0.35); mg.addColorStop(0, 'rgba(255,250,230,0.5)'); mg.addColorStop(1, 'rgba(255,250,230,0)');
      ctx.strokeStyle = mg; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(bx - 8 + cell * 0.38, by - 7); ctx.lineTo(bx + 8 + boardSize - cell * 0.38, by - 7); ctx.stroke(); ctx.restore(); }
    { // light running around the rim
      const per = 2 * (boardSize + 16) * 2, d = (now * 0.12) % per, L = boardSize + 16, pt = q => { q = ((q % (4 * L)) + 4 * L) % (4 * L); return q < L ? [bx - 8 + q, by - 8] : q < 2 * L ? [bx + 8 + boardSize, by - 8 + q - L] : q < 3 * L ? [bx + 8 + boardSize - (q - 2 * L), by + 8 + boardSize] : [bx - 8, by + 8 + boardSize - (q - 3 * L)]; };
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; for (let j = 0; j < 14; j++) { const [x, y] = pt(d - j * 6); ctx.fillStyle = hexA(theme.aur[1] || theme.aur[0], 0.5 * (1 - j / 14)); ctx.beginPath(); ctx.arc(x, y, 3 - j * 0.15, 0, Math.PI * 2); ctx.fill(); } ctx.restore(); }
    if (feverT > 0.02) {
      ctx.save(); ctx.globalAlpha = feverT; const hue = `hsl(${(now / 7) % 360},100%,62%)`;
      ctx.strokeStyle = hue; ctx.shadowColor = hue; ctx.shadowBlur = cell * 0.7; ctx.lineWidth = 3;
      rr(bx - 8, by - 8, boardSize + 16, boardSize + 16, cell * 0.38); ctx.stroke(); ctx.restore();
    }

    const pulse = 0.55 + 0.45 * Math.sin(now / 110);
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const x = bx + c * cell, y = by + r * cell, v = board[r][c], k = r * N + c;
      if (v < 0) {
        ctx.fillStyle = theme.empty; rr(x + cell * 0.06, y + cell * 0.06, cell * 0.88, cell * 0.88, cell * 0.17); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.25)'; rr(x + cell * 0.06, y + cell * 0.06, cell * 0.88, cell * 0.12, cell * 0.08); ctx.fill();
        if (feverT > 0.02) { const wv2 = 0.5 + 0.5 * Math.sin(now / 160 - (r + c) * 0.7); ctx.fillStyle = `hsla(${(now / 8 + (r + c) * 25) % 360},100%,60%,${0.22 * feverT * wv2})`; rr(x + cell * 0.06, y + cell * 0.06, cell * 0.88, cell * 0.88, cell * 0.17); ctx.fill(); }
        const tw = Math.sin(now * 0.0021 + k * 2.17) ; if (tw > 0.985) { const a = (tw - 0.985) / 0.015; ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#ffffff'; const cx = x + cell / 2, cy = y + cell / 2, q = cell * 0.18;
          ctx.beginPath(); ctx.moveTo(cx, cy - q); ctx.lineTo(cx + q * 0.2, cy - q * 0.2); ctx.lineTo(cx + q, cy); ctx.lineTo(cx + q * 0.2, cy + q * 0.2); ctx.lineTo(cx, cy + q); ctx.lineTo(cx - q * 0.2, cy + q * 0.2); ctx.lineTo(cx - q, cy); ctx.lineTo(cx - q * 0.2, cy - q * 0.2); ctx.fill(); ctx.restore(); }
      } else {
        let s = cell, o = 0;
        if (pop[k] > 0) { const p = pop[k] / 0.18; s = cell * (1 + 0.14 * Math.sin(p * Math.PI)); o = (cell - s) / 2; }
        const inPrev = preview.has(k);
        drawBlock(x + o, y + o, s, inPrev && drag ? drag.ci : v, 1, inPrev ? pulse : 0);
      }
    }

    // Ghost + highlight of empty cells that would clear
    if (drag && ghost) {
      drawPiece(drag.sh, drag.ci, bx + ghost.c * cell, by + ghost.r * cell, cell, 0.36, 0);
      ctx.save(); ctx.globalAlpha = 0.2 * pulse; ctx.fillStyle = COLORS[drag.ci].glow;
      preview.forEach(k => { const r = Math.floor(k / N), c = k % N; if (board[r][c] < 0) { rr(bx + c * cell + cell * 0.06, by + r * cell + cell * 0.06, cell * 0.88, cell * 0.88, cell * 0.17); ctx.fill(); } });
      ctx.restore();
    }

    // Bomb aim
    if (bombMode && bombAim) {
      ctx.save(); ctx.globalAlpha = 0.25 + 0.2 * pulse; ctx.fillStyle = '#ff7a3c'; ctx.shadowColor = '#ff7a3c'; ctx.shadowBlur = cell * 0.5;
      const r0 = Math.max(0, bombAim.r - 1), c0 = Math.max(0, bombAim.c - 1), r1 = Math.min(N - 1, bombAim.r + 1), c1 = Math.min(N - 1, bombAim.c + 1);
      rr(bx + c0 * cell + 2, by + r0 * cell + 2, (c1 - c0 + 1) * cell - 4, (r1 - r0 + 1) * cell - 4, cell * 0.25); ctx.fill(); ctx.restore();
    } else if (bombMode) {
      ctx.save(); ctx.globalAlpha = 0.5 + 0.3 * pulse; ctx.strokeStyle = '#ff7a3c'; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
      rr(bx - 4, by - 4, boardSize + 8, boardSize + 8, cell * 0.32); ctx.stroke(); ctx.restore();
    }

    // Clearing blocks
    for (const a of clearing) {
      const t = a.t - a.delay, x = bx + a.c * cell, y = by + a.r * cell;
      if (t < 0) { drawBlock(x, y, cell, a.ci, 1, 0.6); continue; }
      const p = Math.min(1, t / 0.38), s = cell * (1 + 0.25 * p) * (1 - p * 0.9), o = (cell - s) / 2;
      drawBlock(x + o, y + o, s, a.ci, 1 - p, 1);
    }

    // Line beams
    for (const b of beams) {
      const p = b.t / 0.42; if (p > 1) continue;
      const col = COLORS[b.ci] || COLORS[0], th = cell * (0.95 - 0.8 * p), len = boardSize * (0.25 + 0.85 * Math.min(1, p * 3));
      ctx.save(); ctx.globalAlpha = (1 - p) * 0.7; ctx.fillStyle = col.base;
      if (b.kind === 'row') { const y = by + (b.i + 0.5) * cell; rr(bx - cell * 0.3, y - th, boardSize + cell * 0.6, th * 2, th); } else { const x = bx + (b.i + 0.5) * cell; rr(x - th, by - cell * 0.3, th * 2, boardSize + cell * 0.6, th); }
      ctx.fill(); ctx.restore();
      ctx.save(); ctx.globalAlpha = 1 - p; ctx.shadowColor = col.glow; ctx.shadowBlur = cell; ctx.fillStyle = '#ffffff';
      if (b.kind === 'row') { const y = by + (b.i + 0.5) * cell; rr(bx + boardSize / 2 - len / 2, y - th / 2, len, th, th / 2); }
      else { const x = bx + (b.i + 0.5) * cell; rr(x - th / 2, by + boardSize / 2 - len / 2, th, len, th / 2); }
      ctx.fill(); ctx.restore();
    }

    // Tray
    for (let i = 0; i < 3; i++) {
      const p = tray[i]; if (!p || (drag && drag.slot === i)) continue;
      const sh = SHAPES[p.si], cs = cell * trayScale, rc = slotRect(i);
      ctx.save(); ctx.translate(rc.x + rc.w / 2, rc.y + rc.h / 2);
      if (trayIn[i] > 0) ctx.scale(...(() => { const s = easeOutBack(Math.max(0, Math.min(1, 1 - trayIn[i] / 0.35))); return [Math.max(0.001, s), Math.max(0.001, s)]; })());
      if (rotAnim[i] > 0) ctx.rotate(-(rotAnim[i] / 0.22) * Math.PI / 2);
      const idle = trayFit[i] ? Math.sin(now / 600 + i * 1.3) * cs * 0.04 : 0;
      drawPiece(sh, p.ci, -sh.w * cs / 2, -sh.h * cs / 2 + idle, cs, trayFit[i] ? 1 : 0.28, 0);
      ctx.restore();
    }

    // Dragged piece
    if (drag) {
      const cs = cell * drag.s, lx = drag.cx - drag.sh.w * cs / 2, ty = drag.cy - drag.sh.h * cs / 2;
      ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = '#000'; for (const [dr, dc] of drag.sh.cells) { rr(lx + dc * cs + cs * 0.18, ty + dr * cs + cs * 0.4, cs * 0.86, cs * 0.86, cs * 0.2); ctx.fill(); } ctx.restore();
      drawPiece(drag.sh, drag.ci, drag.cx - drag.sh.w * cs / 2, drag.cy - drag.sh.h * cs / 2, cs, 1, 0.35);
    }

    // Shockwaves
    for (const wv of waves) {
      if (wv.t < 0) continue;
      const p = Math.min(1, wv.t / 0.45), rad = wv.max * (1 - Math.pow(1 - p, 3));
      ctx.save(); ctx.globalAlpha = (1 - p) * 0.9; ctx.strokeStyle = wv.col; ctx.shadowColor = wv.col; ctx.shadowBlur = cell * 0.5;
      ctx.lineWidth = Math.max(1, cell * 0.22 * (1 - p)); ctx.beginPath(); ctx.arc(wv.x, wv.y, rad, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, 1 - p.age / p.life); ctx.fillStyle = p.color;
      if (p.sq) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.age * 8); ctx.fillRect(-p.size, -p.size, p.size * 2, p.size * 2); ctx.restore(); }
      else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.globalAlpha = 1;

    // Floating text
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const f of floats) {
      if (f.age < 0) continue;
      const pIn = Math.min(1, f.age / 0.14), scale = 0.6 + 0.4 * pIn + (pIn < 1 ? 0.15 * Math.sin(pIn * Math.PI) : 0);
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - Math.max(0, f.age - 0.5) / (f.life - 0.5));
      ctx.translate(f.x, f.y); ctx.scale(scale, scale);
      ctx.font = `900 ${f.size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
      ctx.shadowColor = f.color; ctx.shadowBlur = f.size * 0.6;
      ctx.lineWidth = Math.max(2, f.size * 0.13); ctx.strokeStyle = 'rgba(7,11,22,0.88)'; ctx.strokeText(f.text, 0, 0);
      ctx.fillStyle = f.color; ctx.fillText(f.text, 0, 0);
      ctx.restore();
    }
    ctx.restore();

    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.5, flash * 2.5)})`; ctx.fillRect(0, 0, W, H); }
  }

  // ================= Update =================
  function update(dt) {
    shake = Math.max(0, shake - dt * 2.6);
    flash = Math.max(0, flash - dt);
    feverT += ((isFever() ? 1 : 0) - feverT) * Math.min(1, dt * 3);
    for (let i = 0; i < N * N; i++) if (pop[i] > 0) pop[i] = Math.max(0, pop[i] - dt);
    for (let i = 0; i < 3; i++) { trayIn[i] = Math.max(0, trayIn[i] - dt); rotAnim[i] = Math.max(0, rotAnim[i] - dt); }
    for (const a of clearing) {
      a.t += dt;
      if (!a.spawned && a.t >= a.delay) { a.spawned = true; spawnParticles(bx + a.c * cell + cell / 2, by + a.r * cell + cell / 2, a.ci); }
    }
    clearing = clearing.filter(a => a.t < a.delay + 0.4);
    beams.forEach(b => b.t += dt); beams = beams.filter(b => b.t < 0.42);
    waves.forEach(w => w.t += dt); waves = waves.filter(w => w.t < 0.45);
    for (const p of particles) { p.age += dt; p.vy += cell * 22 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    particles = particles.filter(p => p.age < p.life);
    for (const f of floats) { f.age += dt; if (f.age > 0) f.y -= cell * 0.9 * dt; }
    floats = floats.filter(f => f.age < f.life);

    displayScore += (score - displayScore) * Math.min(1, dt * 10);
    if (Math.abs(score - displayScore) < 0.5) displayScore = score;
    scoreEl.textContent = Math.round(displayScore);
    bestEl.textContent = best;

    if (drag) {
      drag.s += (1 - drag.s) * Math.min(1, dt * 18);
      const lift = drag.touch ? drag.sh.h * cell * drag.s / 2 + cell * 0.9 : 0;
      drag.cx = drag.x; drag.cy = drag.y - lift;
      const left = drag.cx - drag.sh.w * cell / 2, top = drag.cy - drag.sh.h * cell / 2;
      const c = Math.round((left - bx) / cell), r = Math.round((top - by) / cell);
      if (canPlace(drag.sh, r, c)) {
        if (!ghost || ghost.r !== r || ghost.c !== c) { ghost = { r, c }; computePreview(); }
      } else if (ghost) { ghost = null; preview.clear(); }
    }

    if (overPending > 0) { overPending -= dt; if (overPending <= 0 && !gameOver) showOver(); }
  }

  let last = 0;
  function frame(t) {
    const dt = last ? Math.min(0.05, (t - last) / 1000) : 0; last = t;
    update(dt);
    if (IB) { const fv = isFever(); if (fv !== lastFever) { lastFever = fv; applyBg(); if (fv) IB.pulse(null, null, 2.5, '#ff9a3c'); } IB.frame(t, dt); } else drawBg(t);
    draw(t);
    requestAnimationFrame(frame);
  }

  // ================= Input =================
  function pt(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function boardCell(x, y) {
    const c = Math.floor((x - bx) / cell), r = Math.floor((y - by) / cell);
    return r >= 0 && c >= 0 && r < N && c < N ? { r, c } : null;
  }
  canvas.addEventListener('pointerdown', e => {
    if (!started || gameOver || overPending > 0 || drag) return;
    ac();
    const { x, y } = pt(e);
    if (bombMode) {
      const bc = boardCell(x, y);
      if (bc) { bombAim = bc; bombPress = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
      else { bombMode = false; bombAim = null; syncPW(); toast('Bomb cancelled'); checkOver(); }
      return;
    }
    for (let i = 0; i < 3; i++) {
      const rc = slotRect(i);
      if (tray[i] && x >= rc.x && x <= rc.x + rc.w && y >= rc.y - cell * 0.4 && y <= rc.y + rc.h) {
        drag = { slot: i, ci: tray[i].ci, sh: SHAPES[tray[i].si], x, y, cx: x, cy: y, s: trayScale, touch: e.pointerType !== 'mouse' };
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
        sfx.pick(); buzz(5); e.preventDefault();
        return;
      }
    }
    if (IB) IB.tap(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointermove', e => {
    const p = pt(e);
    if (bombMode) { const bc = boardCell(p.x, p.y); if (bc || bombPress) bombAim = bc || bombAim; return; }
    if (!drag) return; drag.x = p.x; drag.y = p.y; e.preventDefault();
  });
  canvas.addEventListener('pointerup', e => {
    if (bombPress) {
      bombPress = false; const p = pt(e), bc = boardCell(p.x, p.y);
      if (bc) explode(bc.r, bc.c); else bombAim = null;
      return;
    }
    if (!drag) return;
    if (ghost) place(drag.slot, ghost.r, ghost.c);
    else if (drag.cy < trayY - cell * 0.5) sfx.invalid();
    drag = null; ghost = null; preview.clear();
  });
  canvas.addEventListener('pointercancel', () => { drag = null; ghost = null; preview.clear(); bombPress = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  // ================= Buttons =================
  function syncSettings() {
    $('musicBtn').textContent = musicOn ? '🎵 Music: On' : '🎵 Music: Off';
    $('soundBtn').textContent = muted ? '🔇 Sound: Off' : '🔊 Sound: On';
  }
  $('pwRotate').addEventListener('click', () => usePower('rotate'));
  $('pwBomb').addEventListener('click', () => usePower('bomb'));
  $('pwShuffle').addEventListener('click', () => usePower('shuffle'));
  $('menuBtn').addEventListener('click', () => { renderThemes(); $('menuOverlay').classList.add('show'); });
  $('closeMenu').addEventListener('click', () => $('menuOverlay').classList.remove('show'));
  $('musicBtn').addEventListener('click', () => {
    musicOn = !musicOn; store.set('mg_music', musicOn); syncSettings();
    startMusic(); if (musicGain) musicGain.gain.setTargetAtTime(musicOn ? 1 : 0, actx.currentTime, 0.15);
    if (musicOn) musicTick();
  });
  $('soundBtn').addEventListener('click', () => { muted = !muted; store.set('mg_muted', muted); syncSettings(); if (!muted) sfx.pick(); });
  $('newGameBtn').addEventListener('click', () => { $('menuOverlay').classList.remove('show'); if (score > 0 && !gameOver) $('confirmOverlay').classList.add('show'); else newGame(); });
  $('confirmYes').addEventListener('click', newGame);
  $('confirmNo').addEventListener('click', () => $('confirmOverlay').classList.remove('show'));
  $('againBtn').addEventListener('click', newGame);
  $('reviveBtn').addEventListener('click', () => { ac(); revive(); });
  $('playBtn').addEventListener('click', () => {
    started = true; ac(); startMusic();
    $('startOverlay').classList.remove('show');
    if (!trayFit.some(Boolean)) checkOver();
  });
  $('startThemes').addEventListener('click', () => { renderThemes(); $('menuOverlay').classList.add('show'); });

  // ================= Interactive background =================
  const BG_SHAPE = { midnight: 'star', neon: 'hex', candy: 'mix', gems: 'hex' };
  const MPENT = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1568];
  let lastFever = false;
  function bgOpts() {
    const hot = isFever();
    return { bgA: theme.bgA, bgB: theme.bgB, aur: hot ? ['#ff3d6e', '#ffb547'] : theme.aur, palette: theme.colors.slice(0, 4).map(c => c.base),
      shape: BG_SHAPE[themeId] || 'star', stars: 70, count: 20, scene: typeof IBG_SCENES !== 'undefined' ? IBG_SCENES.forLevel('grid', curLevel) : null };
  }
  const IB = typeof InteractiveBG === 'function' ? InteractiveBG(bgCanvas, Object.assign(bgOpts(), {
    sound: (type, p) => { if (type === 'pop' && HAS_W) Wallet.event('bubbles'); if (type === 'pop') { const f = MPENT[Math.floor(p * 6) + 2]; tone(f, 0.25, { vol: 0.09 }); tone(f * 1.5, 0.18, { vol: 0.03, delay: 0.04 }); } else tone(MPENT[Math.floor(p * 4)], 0.25, { vol: 0.05 }); }
  })) : null;
  function applyBg() { if (IB) IB.setTheme(bgOpts()); }
  $('startOverlay').addEventListener('pointerdown', e => { if (IB && (e.target === $('startOverlay') || e.target.classList.contains('start'))) { ac(); IB.tap(e.clientX, e.clientY); } });

  // ================= Boot =================
  layout();
  if (window.ResizeObserver) new ResizeObserver(layout).observe(stage);
  window.addEventListener('resize', layout);
  if (HAS_W) { const tg = () => { let got = 0; ['rotate', 'bomb', 'shuffle'].forEach(k => { const n = Wallet.take('mg_' + k); if (n) { PW[k] += n; got++; } }); if (got) { savePW(); syncPW(); toast('Boosters from the Arcade shop added! 🎁'); } }; tg(); Wallet.onChange(tg); }
  if (HAS_W) { Wallet.addBackButton(document.querySelector('#startOverlay .start')); Wallet.addBackButton(document.querySelector('#menuOverlay .card')); Wallet.setGameLevel('mg', curLevel); }
  setTheme(themeId); syncSettings(); syncPW(); syncLevel();
  load();
  if (hadSave) $('playBtn').textContent = 'Continue';
  requestAnimationFrame(frame);
})();
</script>
